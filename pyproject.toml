[project]
name = "trend-inbox"
version = "0.1.0"
description = "主动收集每天Agent开发的热门趋势到你的邮箱。"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "markdown-it-py>=3,<5",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "requests>=2.32,<3",
    "tzdata",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_digest"]
